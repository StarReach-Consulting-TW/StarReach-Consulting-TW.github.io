<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄表日程表整理器</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEADD;
    --ink:#1C2B33;
    --ink-soft:#5B6B72;
    --rule:#CFC6AE;
    --amber:#C8860A;
    --amber-deep:#9C6706;
    --steel:#3E5C6E;
    --steel-soft:#DCE6E8;
    --good:#3E7A4C;
    --bad:#B4432F;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', 'Noto Sans TC', -apple-system, sans-serif;
  }
  @font-face{font-family:'sysfallback';src:local('Arial');}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, #FBF8F0 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---- Header / meter dial ---- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    padding-bottom:22px; margin-bottom:28px; border-bottom:1px solid var(--rule);
    flex-wrap:wrap;
  }
  .title-block .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber-deep); margin:0 0 8px;
  }
  h1{font-size:26px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0; max-width:46ch; line-height:1.5;}

  .dial{
    display:flex; align-items:center; gap:12px;
    font-family:var(--mono);
  }
  .dial .digits{
    display:flex; gap:2px; background:var(--ink); border-radius:6px; padding:8px 10px;
    box-shadow: inset 0 0 0 1px #000, 0 2px 0 var(--amber-deep);
  }
  .dial .digit{
    width:20px; text-align:center; font-size:20px; color:#F3E7C9;
    font-variant-numeric:tabular-nums;
  }
  .dial .caption{font-size:10.5px; color:var(--ink-soft); letter-spacing:.12em; text-transform:uppercase;}

  /* ---- Upload zone ---- */
  .drop{
    border:1.5px dashed var(--rule);
    border-radius:10px;
    background:var(--paper-2);
    padding:28px 24px;
    display:flex; align-items:center; gap:18px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .drop:hover, .drop.drag{ border-color:var(--amber); background:#F3ECD8; }
  .drop input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop .icon{
    width:44px;height:44px;border-radius:8px;flex:none;
    background:var(--steel-soft); display:flex;align-items:center;justify-content:center;
    color:var(--steel); font-family:var(--mono); font-size:18px;
  }
  .drop .txt b{display:block;font-size:15px;margin-bottom:3px;}
  .drop .txt span{font-size:13px;color:var(--ink-soft);}
  .filename{font-family:var(--mono); font-size:12.5px; color:var(--steel); margin-top:2px;}

  .status{
    margin-top:14px; font-size:13.5px; font-family:var(--mono);
    padding:10px 14px; border-radius:6px; display:none;
  }
  .status.show{display:block;}
  .status.err{background:#F7E4DE; color:var(--bad); border:1px solid #E3B5A6;}
  .status.ok{background:#E7F0E5; color:var(--good); border:1px solid #BBD8B7;}

  /* ---- Results ---- */
  .results{ margin-top:34px; display:none; }
  .results.show{display:block;}

  .summary-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:26px;
  }
  .card{
    background:#fff; border:1px solid var(--rule); border-radius:8px; padding:14px 16px;
  }
  .card .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:6px;}
  .card .v{font-family:var(--mono); font-size:18px; font-weight:600;}

  h2.section{
    font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--steel);
    margin:30px 0 12px; display:flex; align-items:center; gap:10px;
  }
  h2.section::after{content:''; flex:1; height:1px; background:var(--rule);}

  .downloads{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;
  }
  .dl-btn{
    display:flex; flex-direction:column; gap:6px; text-align:left;
    background:var(--ink); color:#F3E7C9; border:none; border-radius:8px;
    padding:14px 16px; cursor:pointer; font-family:var(--sans);
    transition:transform .1s ease, box-shadow .1s ease;
    box-shadow:0 2px 0 var(--amber-deep);
  }
  .dl-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 0 var(--amber-deep); }
  .dl-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 var(--amber-deep); }
  .dl-btn .n{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.08em;}
  .dl-btn .t{font-size:14.5px; font-weight:600;}
  .dl-btn .d{font-size:12px; color:#C9BFA0; line-height:1.4;}

  /* calendar view */
  :root{
    --read:#FFE27A; --read-edge:#D9A900; --read-ink:#5A4300;
    --off:#F8CBD6;  --off-ink:#A63D57;
  }
  .cal-tools{
    display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px;
    margin-bottom:14px; font-size:12.5px;
  }
  .cal-tools .legend{ display:flex; flex-wrap:wrap; gap:6px 16px; align-items:center; }
  .cal-tools .lg{ display:inline-flex; align-items:center; gap:6px; color:var(--ink-soft); }
  .sw{ width:18px; height:18px; border-radius:4px; border:1px solid var(--rule); display:inline-block; position:relative; }
  .sw.read{ background:var(--read); border-color:var(--read-edge); }
  .sw.off{ background:var(--off); }
  .sw.both{ background:var(--read); border-color:var(--read-edge); }
  .sw.both::after{ content:''; position:absolute; top:0; right:0; border-style:solid; border-width:0 8px 8px 0; border-color:transparent var(--off-ink) transparent transparent; }
  .cal-btns{ margin-left:auto; display:flex; gap:8px; }
  .mini-btn{
    font-family:var(--sans); font-size:12px; color:var(--steel); background:#fff;
    border:1px solid var(--rule); border-radius:6px; padding:5px 10px; cursor:pointer;
  }
  .mini-btn:hover{ border-color:var(--amber); color:var(--amber-deep); }
  .cal-note{ font-size:12px; color:var(--ink-soft); margin:0 0 14px; line-height:1.6; }
  .cal-note b{ color:var(--ink); }
  .cal-note .warn{ color:var(--bad); }

  .cal-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:14px; }
  .month{ background:#fff; border:1px solid var(--rule); border-radius:8px; padding:12px 12px 10px; }
  .month h3{ margin:0 0 8px; font-size:14px; font-family:var(--mono); letter-spacing:.04em; display:flex; justify-content:space-between; align-items:baseline; }
  .month h3 small{ font-size:11px; color:var(--ink-soft); font-weight:400; }
  .dow, .days{ display:grid; grid-template-columns:repeat(7,1fr); gap:3px; }
  .dow span{ text-align:center; font-size:11px; color:var(--ink-soft); padding-bottom:2px; }
  .dow span:first-child, .dow span:last-child{ color:var(--off-ink); }
  .day{
    min-height:36px; border-radius:4px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; font-family:var(--mono); font-size:12.5px;
    position:relative; line-height:1.15; border:1px solid transparent;
  }
  .day.empty{ visibility:hidden; }
  .day .sq{ font-size:9.5px; color:var(--read-ink); opacity:.85; }
  .day.hd{ background:var(--off); color:var(--off-ink); }
  /* 抄表日放在後面：與假日重疊時，黃底優先 */
  .day.rd{ background:var(--read); border-color:var(--read-edge); color:var(--ink); font-weight:700; }
  .day.rd.hd::after{ content:''; position:absolute; top:0; right:0; border-style:solid; border-width:0 8px 8px 0; border-color:transparent var(--off-ink) transparent transparent; border-top-right-radius:3px; }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:12px; }
  
  footer{ margin-top:50px; text-align:center; font-size:11.5px; color:var(--ink-soft); }
  a.reset{ color:var(--steel); cursor:pointer; text-decoration:underline; }

  @media (max-width:640px){
    .summary-row{grid-template-columns:1fr 1fr;}
    header{flex-direction:column; align-items:flex-start;}
  }

  /* ---- 列印 / 匯出 PDF ---- */
  .print-head{ display:none; }
  @media print{
    @page{ size:A4 landscape; margin:0; }
    *{ -webkit-print-color-adjust:exact; print-color-adjust:exact; }
    html,body{ background:#fff !important; }
    body{ padding:8mm 10mm !important; min-height:0 !important; }
    .wrap{ max-width:none !important; }
    /* 隱藏操作介面，只留標題＋年曆 */
    header, .drop, #status, footer, .summary-row, .downloads,
    h2.section, .cal-btns, .hint{ display:none !important; }
    .results{ display:block !important; margin-top:0 !important; }

    .print-head{ display:flex !important; justify-content:space-between; align-items:flex-end;
      border-bottom:1.2px solid var(--ink); padding-bottom:2mm; margin-bottom:2.5mm; }
    .print-head h1{ font-size:17px; margin:0; letter-spacing:.02em; }
    .print-head p{ margin:0; font-size:9.5px; color:var(--ink-soft); text-align:right; line-height:1.5; }

    .cal-tools{ margin:0 0 2mm; }
    .cal-tools .lg{ font-size:9.5px; }
    .sw{ width:12px; height:12px; }
    .sw.both::after{ border-width:0 6px 6px 0; }
    .cal-note{ font-size:9px; margin:0 0 2.5mm; line-height:1.4; }

    .cal-grid{ grid-template-columns:repeat(var(--pcols,4),1fr); gap:3mm; }
    .month{ padding:2mm 2mm 1.5mm; border-radius:3px; break-inside:avoid; page-break-inside:avoid; }
    .month h3{ font-size:10.5px; margin:0 0 1.2mm; }
    .month h3 small{ font-size:8px; }
    .dow, .days{ gap:1px; }
    .dow span{ font-size:8px; padding-bottom:.5mm; }
    .day{ min-height:6.3mm; font-size:9px; border-radius:2px; }
    .day .sq{ font-size:6.5px; }
    .day.rd.hd::after{ border-width:0 5px 5px 0; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <p class="eyebrow">Meter&nbsp;Reading&nbsp;Cycle&nbsp;Organizer</p>
      <h1>抄表日程表整理器</h1>
      <p class="sub">上傳原始抄表輪期 .xls 檔，自動換算全年 12 個抄表月份、17 個日序的抄表日與開票日，並產出 3 種下載格式。</p>
    </div>
    <div class="dial" id="yearDial" style="visibility:hidden;">
      <div class="digits" id="digits"></div>
      <span class="caption">民國→西元</span>
    </div>
  </header>

  <label class="drop" id="dropZone">
    <span class="icon">XLS</span>
    <span class="txt">
      <b>選取或拖曳抄表輪期檔案</b>
      <span>支援 .xls／.xlsx，例如 NBY812_116.xls</span>
      <div class="filename" id="fileName"></div>
    </span>
    <input type="file" id="fileInput" accept=".xls,.xlsx">
  </label>

  <div class="status" id="status"></div>

  <div class="results" id="results">

    <div class="summary-row">
      <div class="card"><div class="k">來源年度 (民國)</div><div class="v" id="rocYear">—</div></div>
      <div class="card"><div class="k">起始年度 (西元)</div><div class="v" id="baseYear">—</div></div>
      <div class="card"><div class="k">首個抄表日</div><div class="v" id="firstDate">—</div></div>
    </div>

    <h2 class="section">下載</h2>
    <div class="downloads">
      <button class="dl-btn" id="dl1">
        <span class="n">載點 01</span>
        <span class="t">日程表.xlsx</span>
        <span class="d">工作簿含 2 張工作表：日程表／日程表(含開票日)</span>
      </button>
      <button class="dl-btn" id="dl2">
        <span class="n">載點 02</span>
        <span class="t">開票日程google日曆設定.csv</span>
        <span class="d">可直接匯入 Google 日曆的全天事件</span>
      </button>
      <button class="dl-btn" id="dl3">
        <span class="n">載點 03</span>
        <span class="t">billing_schedule.csv</span>
        <span class="d">抄表周期表 csv 檔，匯入資料庫用</span>
      </button>
    </div>

    <h2 class="section">年度抄表日曆</h2>
    <div class="print-head" id="printHead"><h1 id="phTitle"></h1><p id="phMeta"></p></div>
    <div class="cal-tools">
      <div class="legend">
        <span class="lg"><i class="sw read"></i>抄表日（數字為日序）</span>
        <span class="lg"><i class="sw off"></i>例假日／國定假日</span>
        <span class="lg"><i class="sw both"></i>抄表日遇假日</span>
      </div>
      <div class="cal-btns">
        <button class="mini-btn" id="calPdf" type="button" style="background:var(--ink);color:#F3E7C9;border-color:var(--ink);">匯出 PDF</button>
        <button class="mini-btn" id="calOnline" type="button">線上更新假日</button>
        <button class="mini-btn" id="calImportBtn" type="button">匯入日曆檔</button>
        <input type="file" id="calImport" accept=".csv,.json,.ics,.txt" multiple style="display:none;">
      </div>
    </div>
    <p class="cal-note" id="calStatus"></p>
    <div class="cal-grid" id="calGrid"></div>
    <p class="hint">滑鼠移到日期上可看抄表月別、日序、開票日與假日名稱。</p>
  </div>

  <footer>
    每次上傳皆在瀏覽器本機端運算，檔案不會上傳到伺服器。 <span class="reset" id="resetLink">重新選取檔案</span>
  </footer>

</div>

<script>
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const START_COLS  = ['G','M','S','Y','AE','AK','AQ','AW','BC','BI','BO','BU'];

function pad2(n){ return String(n).padStart(2,'0'); }

function colOffset(letter, off){
  const idx = XLSX.utils.decode_col(letter);
  return XLSX.utils.encode_col(idx + off);
}

// Build the 16 row-pairs for day-seq 01..16 (rows 10-47, skipping a blank
// separator pair every 4 entries).
function buildDayRows(){
  const rows = [];
  let r = 10;
  for(let i=0;i<16;i++){
    rows.push([r, r+1]);
    r += 2;
    if((i+1)%4===0) r += 2;
  }
  return rows;
}

function cellVal(ws, addr){
  const c = ws[addr];
  if(!c || c.v===undefined || c.v===null || c.v==='') return null;
  return c.v;
}

// Sequential state machine for one date series (抄表日 or 開票日), carried
// across all 12 month-blocks in order.
function makeSeries(startYear){
  return { year:startYear, month:null, lastDay:null };
}
function advance(state, monthCell, dayCell){
  const d = parseInt(dayCell, 10);
  if(monthCell !== null){
    const newM = parseInt(monthCell, 10);
    if(state.month !== null && newM < state.month) state.year += 1;
    state.month = newM;
  } else {
    if(state.lastDay !== null && d <= state.lastDay){
      state.month += 1;
      if(state.month > 12){ state.month = 1; state.year += 1; }
    }
  }
  state.lastDay = d;
  return { y: state.year, m: state.month, d: d };
}

function isoDate(dt){ return `${dt.y}-${pad2(dt.m)}-${pad2(dt.d)}`; }
function slashDate(dt){ return `${dt.y}/${dt.m}/${dt.d}`; }

function parseWorkbook(ws){
  const ae3 = cellVal(ws, 'AE3');
  if(ae3 === null) throw new Error('找不到 AE3 儲存格（民國年度），請確認檔案格式與原始範本相符。');
  const rocYear = parseInt(ae3, 10);
  const baseYear = rocYear + 1911;

  const dayRows = buildDayRows();
  const stateRead = makeSeries(baseYear - 1);
  const stateBill = makeSeries(baseYear - 1);

  const monthData = {}; // monthName -> [ {dayseq, read:{y,m,d}, bill:{y,m,d}}, ... 17 entries ]

  START_COLS.forEach((baseCol, mi) => {
    const mname = MONTH_NAMES[mi];
    const rmc = baseCol, rdc = colOffset(baseCol,1);
    const bmc = colOffset(baseCol,2), bdc = colOffset(baseCol,3);
    const entries = [];
    dayRows.forEach(([r1,r2], idx) => {
      const rmv = cellVal(ws, `${rmc}${r1}`);
      const rdv = cellVal(ws, `${rdc}${r2}`);
      const bmv = cellVal(ws, `${bmc}${r1}`);
      const bdv = cellVal(ws, `${bdc}${r2}`);
      if(rdv === null || bdv === null){
        throw new Error(`解析失敗：${mname} 日序${pad2(idx+1)} 缺少必要的日期資料 (檢查欄位 ${rdc}${r2} / ${bdc}${r2})。`);
      }
      const readDate = advance(stateRead, rmv, rdv);
      const billDate = advance(stateBill, bmv, bdv);
      entries.push({ dayseq: idx+1, read: readDate, bill: billDate });
    });
    // day-seq 17: fixed rule - read = 1st of the real month reached at day-seq 16;
    // bill = same as day-seq 12's bill date.
    const d16 = entries[15], d12 = entries[11];
    entries.push({
      dayseq: 17,
      read: { y: d16.read.y, m: d16.read.m, d: 1 },
      bill: { y: d12.bill.y, m: d12.bill.m, d: d12.bill.d }
    });
    monthData[mname] = entries;
  });

  return { rocYear, baseYear, monthData };
}

function cyclecd(dayseq){
  if(dayseq === 17) return [49,50,51];
  return [dayseq, dayseq+16, dayseq+32];
}

// ---------- Output builders ----------

function buildScheduleWorkbook(monthData){
  const wb = XLSX.utils.book_new();

  // Sheet 1: 日序 | CYCLECD x3 | 一月..十二月 (抄表日 only)
  const header1 = ['日序','CYCLECD','CYCLECD','CYCLECD', ...MONTH_NAMES];
  const rows1 = [header1];
  for(let seq=1; seq<=17; seq++){
    const codes = cyclecd(seq);
    const row = [`${pad2(seq)}日序`, ...codes];
    MONTH_NAMES.forEach(mn => {
      const e = monthData[mn].find(x=>x.dayseq===seq);
      row.push(isoDate(e.read));
    });
    rows1.push(row);
  }
  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  XLSX.utils.book_append_sheet(wb, ws1, '日程表');

  // Sheet 2: two header rows - month name spans 2 cols, then 抄表日/開票日 subheader.
  const row1 = ['日序'];
  const row2 = [''];
  MONTH_NAMES.forEach(mn => { row1.push(mn, mn); row2.push('抄表日','開票日'); });
  const rows2 = [row1, row2];
  for(let seq=1; seq<=17; seq++){
    const row = [`${pad2(seq)}日序`];
    MONTH_NAMES.forEach(mn => {
      const e = monthData[mn].find(x=>x.dayseq===seq);
      row.push(isoDate(e.read), isoDate(e.bill));
    });
    rows2.push(row);
  }
  const ws2 = XLSX.utils.aoa_to_sheet(rows2);
  const merges = [];
  let col = 1;
  MONTH_NAMES.forEach(() => {
    merges.push({ s:{r:0,c:col}, e:{r:0,c:col+1} });
    col += 2;
  });
  ws2['!merges'] = merges;
  XLSX.utils.book_append_sheet(wb, ws2, '日程表(含開票日)');

  return wb;
}

function buildCsv3(monthData){
  const lines = ['Subject,Start date,All Day Event'];
  MONTH_NAMES.forEach((mn, mi) => {
    monthData[mn].forEach(e => {
      const subject = `${pad2(mi+1)}月${pad2(e.dayseq)}日序`;
      lines.push(`${subject},${slashDate(e.read)},TRUE`);
    });
  });
  return lines.join('\r\n');
}

function buildCsv4(monthData){
  const lines = ['cyc_dt,billing_dt,period_type'];
  const oddIdx  = [0,2,4,6,8,10];  // 一,三,五,七,九,十一
  const evenIdx = [1,3,5,7,9,11];  // 二,四,六,八,十,十二

  const emit = (idxList, label) => {
    idxList.forEach(mi => {
      const mn = MONTH_NAMES[mi];
      monthData[mn].forEach(e => {
        lines.push(`${pad2(e.dayseq)},${isoDate(e.read)},${label}`);
      });
    });
  };
  emit(oddIdx, 'A');
  emit(evenIdx, 'B');
  emit([...Array(12).keys()], 'C');
  return lines.join('\r\n');
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function downloadCsvBom(text, filename){
  downloadBlob('\uFEFF' + text, filename, 'text/csv;charset=utf-8');
}

// ---------- UI wiring ----------

const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const fileNameEl= document.getElementById('fileName');
const statusEl  = document.getElementById('status');
const resultsEl = document.getElementById('results');
const dial      = document.getElementById('yearDial');
const digitsEl  = document.getElementById('digits');

let currentData = null;

function showStatus(msg, type){
  statusEl.textContent = msg;
  statusEl.className = 'status show ' + type;
}
function clearStatus(){ statusEl.className = 'status'; statusEl.textContent=''; }

function setDial(year){
  digitsEl.innerHTML = '';
  String(year).split('').forEach(ch => {
    const s = document.createElement('span');
    s.className = 'digit'; s.textContent = ch;
    digitsEl.appendChild(s);
  });
  dial.style.visibility = 'visible';
}

// ---------- 辦公日曆（人事行政總處）----------
// 內建 115(2026)、116(2027) 年；其他年度會嘗試線上取得，也可匯入人事總處下載的 CSV / ICS / JSON。
const BUILTIN_CAL = {"2026":{"hol":{"20260101":"開國紀念日","20260215":"小年夜","20260216":"農曆除夕","20260217":"春節","20260218":"春節","20260219":"春節","20260220":"補假","20260227":"補假","20260228":"和平紀念日","20260403":"補假","20260404":"兒童節","20260405":"清明節","20260406":"補假","20260501":"勞動節","20260619":"端午節","20260925":"中秋節","20260928":"孔子誕辰紀念日/教師節","20261009":"補假","20261010":"國慶日","20261025":"臺灣光復暨金門古寧頭大捷紀念日","20261026":"補假","20261225":"行憲紀念日"},"work":[]},"2027":{"hol":{"20270101":"開國紀念日","20270204":"小年夜","20270205":"農曆除夕","20270206":"春節","20270207":"春節","20270208":"春節","20270209":"補假","20270210":"補假","20270228":"和平紀念日","20270301":"補假","20270404":"兒童節","20270405":"清明節","20270406":"補假","20270430":"補假","20270501":"勞動節","20270609":"端午節","20270915":"中秋節","20270928":"孔子誕辰紀念日/教師節","20271010":"國慶日","20271011":"補假","20271025":"臺灣光復暨金門古寧頭大捷紀念日","20271224":"補假","20271225":"行憲紀念日","20271231":"補假"},"work":[]}};
const HOL  = new Map();   // 'YYYYMMDD' -> 放假名稱（平日放假，或有名稱的週末假日）
const WORK = new Set();   // 'YYYYMMDD' -> 週六日補行上班
const CAL_SRC = {};       // 年 -> 來源（內建／線上／匯入）

function dKey(y,m,d){ return `${y}${pad2(m)}${pad2(d)}`; }

function addDay(key, isHol, name, src){
  const y = +key.slice(0,4), m = +key.slice(4,6), d = +key.slice(6,8);
  const dow = new Date(y, m-1, d).getDay();
  const weekend = (dow === 0 || dow === 6);
  if(isHol){
    WORK.delete(key);
    if(name || !weekend) HOL.set(key, name || '');
  }else{
    HOL.delete(key);
    if(weekend) WORK.add(key);
  }
  CAL_SRC[y] = src;
}

function clearYear(y){
  const p = String(y);
  [...HOL.keys()].forEach(k => { if(k.startsWith(p)) HOL.delete(k); });
  [...WORK].forEach(k => { if(k.startsWith(p)) WORK.delete(k); });
  delete CAL_SRC[y];
}

Object.entries(BUILTIN_CAL).forEach(([y, v]) => {
  Object.entries(v.hol).forEach(([k, n]) => addDay(k, true, n, '內建'));
  v.work.forEach(k => addDay(k, false, '', '內建'));
  CAL_SRC[y] = '內建';
});

// 單日判定：補班 > 放假 > 週六日
function dayInfo(y,m,d){
  const key = dKey(y,m,d);
  if(WORK.has(key)) return { off:false, name:'週末補行上班' };
  if(HOL.has(key))  return { off:true,  name:HOL.get(key) || '放假' };
  const dow = new Date(y, m-1, d).getDay();
  if(dow === 0) return { off:true, name:'星期日' };
  if(dow === 6) return { off:true, name:'星期六' };
  return { off:false, name:'' };
}

function normDateKey(s){
  s = String(s || '').trim().replace(/^"|"$/g, '');
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})$/);
  if(m) return m[1] + pad2(m[2]) + pad2(m[3]);
  s = s.replace(/\D/g, '');
  return s.length === 8 ? s : null;
}

// 解析 JSON（TaiwanCalendar 格式）／ CSV（人事總處：西元日期,星期,是否放假,備註）／ ICS
function parseHolidayText(text, src){
  const t = text.replace(/^\uFEFF/, '');
  const trimmed = t.trim();
  let n = 0;

  if(trimmed.startsWith('[') || trimmed.startsWith('{')){
    let arr = JSON.parse(trimmed);
    if(!Array.isArray(arr)) arr = arr.data || [];
    arr.forEach(o => {
      const key = normDateKey(o.date ?? o['西元日期']);
      if(!key) return;
      const flag = o.isHoliday ?? o['是否放假'];
      const isHol = flag === true || String(flag).toLowerCase() === 'true' || String(flag) === '2' || String(flag) === '1';
      addDay(key, isHol, String(o.description ?? o['備註'] ?? '').trim(), src);
      n++;
    });
  }else if(/BEGIN:VCALENDAR/i.test(t)){
    const unfolded = t.replace(/\r?\n[ \t]/g, '');
    (unfolded.match(/BEGIN:VEVENT[\s\S]*?END:VEVENT/g) || []).forEach(ev => {
      const s = ev.match(/DTSTART[^:\r\n]*:(\d{8})/);
      if(!s) return;
      const e = ev.match(/DTEND[^:\r\n]*:(\d{8})/);
      const name = (ev.match(/SUMMARY[^:\r\n]*:(.*)/) || [,''])[1].trim();
      const isWork = /補行上班|補班/.test(name);
      const k0 = s[1];
      const start = new Date(+k0.slice(0,4), +k0.slice(4,6)-1, +k0.slice(6,8));
      let end = new Date(start); end.setDate(end.getDate() + 1);
      if(e) end = new Date(+e[1].slice(0,4), +e[1].slice(4,6)-1, +e[1].slice(6,8));
      for(let c = new Date(start); c < end; c.setDate(c.getDate() + 1)){
        addDay(dKey(c.getFullYear(), c.getMonth()+1, c.getDate()), !isWork, isWork ? '' : name, src);
        n++;
      }
    });
  }else{
    t.split(/\r?\n/).forEach(line => {
      if(!line.trim()) return;
      const p = line.split(',');
      const key = normDateKey(p[0]);
      if(!key) return;                       // 標題列或雜訊
      const flag = String(p[2] || '').trim().replace(/^"|"$/g, '');
      const isHol = flag === '2' || flag === '1' || /^(true|是|放假)$/i.test(flag);
      addDay(key, isHol, p.slice(3).join(',').trim().replace(/^"|"$/g, ''), src);
      n++;
    });
  }
  if(!n) throw new Error('檔案內找不到可辨識的日期資料');
  return n;
}

async function readTextSmart(file){
  const buf = await file.arrayBuffer();
  let s = new TextDecoder('utf-8').decode(buf);
  if(s.includes('\uFFFD')){ try{ s = new TextDecoder('big5').decode(buf); }catch(e){} }
  return s;
}

async function fetchYear(y){
  const res = await fetch(`https://cdn.jsdelivr.net/gh/ruyut/TaiwanCalendar/data/${y}.json`, { cache:'no-cache' });
  if(!res.ok) throw new Error(`${y} 年資料取得失敗 (HTTP ${res.status})`);
  const text = await res.text();
  JSON.parse(text);               // 先驗證格式，成功才清掉舊資料
  clearYear(y);
  parseHolidayText(text, '線上');
}

function neededYears(){
  if(!currentData) return [];
  let lo = 9999, hi = 0;
  MONTH_NAMES.forEach(mn => currentData.monthData[mn].forEach(e => {
    lo = Math.min(lo, e.read.y); hi = Math.max(hi, e.read.y);
  }));
  const ys = []; for(let y = lo; y <= hi; y++) ys.push(y);
  return ys;
}

let calBusy = false;
async function ensureHolidayData(force){
  if(!currentData || calBusy) return;
  const todo = neededYears().filter(y => force || !CAL_SRC[y]);
  if(!todo.length){ renderCalendar(); return; }
  calBusy = true;
  document.getElementById('calStatus').textContent = `正在取得 ${todo.join('、')} 年辦公日曆…`;
  const fails = [];
  for(const y of todo){
    try{ await fetchYear(y); }catch(e){ console.warn(e); fails.push(y); }
  }
  calBusy = false;
  renderCalendar(fails);
}

// ---------- 年曆渲染 ----------
function renderCalendar(fetchFails){
  if(!currentData) return;
  const readMap = new Map();
  let minYM = Infinity, maxYM = -Infinity;

  MONTH_NAMES.forEach(mn => currentData.monthData[mn].forEach(e => {
    const k = dKey(e.read.y, e.read.m, e.read.d);
    if(!readMap.has(k)) readMap.set(k, []);
    readMap.get(k).push({ mn, seq:e.dayseq, bill:isoDate(e.bill) });
    const ym = e.read.y * 12 + (e.read.m - 1);
    if(ym < minYM) minYM = ym;
    if(ym > maxYM) maxYM = ym;
  }));

  const WD = ['日','一','二','三','四','五','六'];
  const overlap = [];
  let html = '';

  for(let ym = minYM; ym <= maxYM; ym++){
    const y = Math.floor(ym / 12), m = (ym % 12) + 1;
    const firstDow = new Date(y, m-1, 1).getDay();
    const dim = new Date(y, m, 0).getDate();
    let readCnt = 0, cells = '';

    for(let i = 0; i < firstDow; i++) cells += '<div class="day empty"></div>';
    for(let d = 1; d <= dim; d++){
      const k = dKey(y, m, d);
      const info = dayInfo(y, m, d);
      const reads = readMap.get(k);
      const cls = ['day'];
      if(info.off) cls.push('hd');
      let inner = `<span>${d}</span>`;
      const tip = [`${y}-${pad2(m)}-${pad2(d)}`];

      if(reads){
        cls.push('rd'); readCnt++;
        const seqs = [...new Set(reads.map(r => pad2(r.seq)))].join('/');
        inner += `<span class="sq">${seqs}</span>`;
        tip.push('抄表日：' + reads.map(r => `${r.mn} ${pad2(r.seq)}日序（開票日 ${r.bill}）`).join('；'));
        if(info.off){ overlap.push(`${m}/${d}`); }
      }
      if(info.off) tip.push('假日：' + info.name);
      else if(info.name) tip.push(info.name);

      cells += `<div class="${cls.join(' ')}" title="${tip.join('\n')}">${inner}</div>`;
    }

    html += `<div class="month"><h3><span>${y} 年 ${m} 月</span><small>${readCnt ? '抄表日 ' + readCnt + ' 天' : ''}</small></h3>`
          + `<div class="dow">${WD.map(w => `<span>${w}</span>`).join('')}</div>`
          + `<div class="days">${cells}</div></div>`;
  }
  const grid = document.getElementById('calGrid');
  grid.innerHTML = html;
  grid.style.setProperty('--pcols', (maxYM - minYM + 1) > 12 ? 5 : 4);   // 超過 12 個月時改 5 欄，仍可排進一頁

  document.getElementById('phTitle').textContent =
    `抄表日程表　民國 ${currentData.rocYear} 年（西元 ${currentData.baseYear}）`;
  const nowD = new Date();
  document.getElementById('phMeta').innerHTML =
    `來源檔案：${(fileNameEl.textContent || '—').replace(/</g, '&lt;')}<br>列印日期：${nowD.getFullYear()}-${pad2(nowD.getMonth()+1)}-${pad2(nowD.getDate())}`;

  // 狀態列：資料來源、缺資料年度、抄表日遇假日
  const years = neededYears();
  const have = years.filter(y => CAL_SRC[y]);
  const miss = years.filter(y => !CAL_SRC[y]);
  const parts = [];
  if(have.length) parts.push(`假日資料：${have.map(y => `${y}（${CAL_SRC[y]}）`).join('、')}`);
  if(miss.length) parts.push(`<span class="warn">${miss.join('、')} 年尚無辦公日曆，暫以週六日標示粉色；可按「線上更新假日」或匯入日曆檔。</span>`);
  if(fetchFails && fetchFails.length) parts.push(`<span class="warn">線上取得失敗：${fetchFails.join('、')}（請檢查網路，或改用匯入）。</span>`);
  parts.push(overlap.length ? `抄表日落在假日：<b>${overlap.length}</b> 天（${overlap.slice(0, 10).join('、')}${overlap.length > 10 ? '…' : ''}）` : '抄表日皆未落在假日');
  const el = document.getElementById('calStatus');
  el.innerHTML = parts.join('　｜　');
}

document.getElementById('calPdf').addEventListener('click', () => {
  if(!currentData) return;
  if(calBusy){ showStatus('假日資料仍在載入，請稍候再匯出。', 'err'); return; }
  window.focus();
  window.print();      // 列印視窗的「目的地」選「另存為 PDF」
});
document.getElementById('calOnline').addEventListener('click', () => ensureHolidayData(true));
document.getElementById('calImportBtn').addEventListener('click', () => document.getElementById('calImport').click());
document.getElementById('calImport').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  const msgs = [];
  for(const f of files){
    try{
      const n = parseHolidayText(await readTextSmart(f), '匯入');
      msgs.push(`${f.name}：${n} 筆`);
    }catch(err){ msgs.push(`${f.name}：${err.message}`); }
  }
  e.target.value = '';
  renderCalendar();
  if(msgs.length) showStatus('日曆匯入結果 — ' + msgs.join('；'), msgs.some(m => /找不到|失敗/.test(m)) ? 'err' : 'ok');
});

function handleFile(file){
  if(!file) return;
  fileNameEl.textContent = file.name;
  clearStatus();
  resultsEl.classList.remove('show');
  dial.style.visibility = 'hidden';

  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type:'array', codepage: 950, cellText:false, cellDates:false });
      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const parsed = parseWorkbook(ws);
      currentData = parsed;

      document.getElementById('rocYear').textContent = parsed.rocYear;
      document.getElementById('baseYear').textContent = parsed.baseYear;
      const first = parsed.monthData['一月'][0];
      document.getElementById('firstDate').textContent = isoDate(first.read);
      setDial(parsed.baseYear);
      renderCalendar();
      ensureHolidayData(false);

      showStatus(`已成功解析「${sheetName}」工作表，年度換算為西元 ${parsed.baseYear} 年。`, 'ok');
      resultsEl.classList.add('show');
    }catch(err){
      console.error(err);
      showStatus('解析失敗：' + err.message, 'err');
    }
  };
  reader.onerror = () => showStatus('讀取檔案時發生錯誤，請重試。', 'err');
  reader.readAsArrayBuffer(file);
}

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

['dragover','dragenter'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drag'); });
});
dropZone.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if(f) handleFile(f);
});

document.getElementById('resetLink').addEventListener('click', () => {
  currentData = null;
  fileInput.value = '';
  fileNameEl.textContent = '';
  resultsEl.classList.remove('show');
  dial.style.visibility = 'hidden';
  clearStatus();
});
