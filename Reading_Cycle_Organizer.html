<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抄表日程表整理器</title>
<script src="xlsx.full.min.js"></script>
<style>
  :root{
    --paper:#F6F3EC;
    --paper-2:#EFEADD;
    --ink:#1C2B33;
    --ink-soft:#5B6B72;
    --rule:#CFC6AE;
    --amber:#C8860A;
    --amber-deep:#9C6706;
    --steel:#3E5C6E;
    --steel-soft:#DCE6E8;
    --good:#3E7A4C;
    --bad:#B4432F;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    --sans: 'IBM Plex Sans', 'Noto Sans TC', -apple-system, sans-serif;
  }
  @font-face{font-family:'sysfallback';src:local('Arial');}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(1200px 500px at 10% -10%, #FBF8F0 0%, transparent 60%),
      var(--paper);
    color:var(--ink);
    font-family:var(--sans);
    min-height:100vh;
    padding:32px 20px 80px;
  }
  .wrap{max-width:920px;margin:0 auto;}

  /* ---- Header / meter dial ---- */
  header{
    display:flex; align-items:flex-end; justify-content:space-between; gap:24px;
    padding-bottom:22px; margin-bottom:28px; border-bottom:1px solid var(--rule);
    flex-wrap:wrap;
  }
  .title-block .eyebrow{
    font-family:var(--mono); font-size:11px; letter-spacing:.18em; text-transform:uppercase;
    color:var(--amber-deep); margin:0 0 8px;
  }
  h1{font-size:26px; margin:0 0 6px; font-weight:700; letter-spacing:-.01em;}
  .sub{color:var(--ink-soft); font-size:14px; margin:0; max-width:46ch; line-height:1.5;}

  .dial{
    display:flex; align-items:center; gap:12px;
    font-family:var(--mono);
  }
  .dial .digits{
    display:flex; gap:2px; background:var(--ink); border-radius:6px; padding:8px 10px;
    box-shadow: inset 0 0 0 1px #000, 0 2px 0 var(--amber-deep);
  }
  .dial .digit{
    width:20px; text-align:center; font-size:20px; color:#F3E7C9;
    font-variant-numeric:tabular-nums;
  }
  .dial .caption{font-size:10.5px; color:var(--ink-soft); letter-spacing:.12em; text-transform:uppercase;}

  /* ---- Upload zone ---- */
  .drop{
    border:1.5px dashed var(--rule);
    border-radius:10px;
    background:var(--paper-2);
    padding:28px 24px;
    display:flex; align-items:center; gap:18px;
    cursor:pointer;
    transition:border-color .15s ease, background .15s ease;
    position:relative;
  }
  .drop:hover, .drop.drag{ border-color:var(--amber); background:#F3ECD8; }
  .drop input[type=file]{ position:absolute; inset:0; opacity:0; cursor:pointer; }
  .drop .icon{
    width:44px;height:44px;border-radius:8px;flex:none;
    background:var(--steel-soft); display:flex;align-items:center;justify-content:center;
    color:var(--steel); font-family:var(--mono); font-size:18px;
  }
  .drop .txt b{display:block;font-size:15px;margin-bottom:3px;}
  .drop .txt span{font-size:13px;color:var(--ink-soft);}
  .filename{font-family:var(--mono); font-size:12.5px; color:var(--steel); margin-top:2px;}

  .status{
    margin-top:14px; font-size:13.5px; font-family:var(--mono);
    padding:10px 14px; border-radius:6px; display:none;
  }
  .status.show{display:block;}
  .status.err{background:#F7E4DE; color:var(--bad); border:1px solid #E3B5A6;}
  .status.ok{background:#E7F0E5; color:var(--good); border:1px solid #BBD8B7;}

  /* ---- Results ---- */
  .results{ margin-top:34px; display:none; }
  .results.show{display:block;}

  .summary-row{
    display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin-bottom:26px;
  }
  .card{
    background:#fff; border:1px solid var(--rule); border-radius:8px; padding:14px 16px;
  }
  .card .k{font-size:10.5px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:6px;}
  .card .v{font-family:var(--mono); font-size:18px; font-weight:600;}

  h2.section{
    font-size:13px; text-transform:uppercase; letter-spacing:.12em; color:var(--steel);
    margin:30px 0 12px; display:flex; align-items:center; gap:10px;
  }
  h2.section::after{content:''; flex:1; height:1px; background:var(--rule);}

  .downloads{
    display:grid; grid-template-columns:repeat(auto-fit,minmax(210px,1fr)); gap:12px;
  }
  .dl-btn{
    display:flex; flex-direction:column; gap:6px; text-align:left;
    background:var(--ink); color:#F3E7C9; border:none; border-radius:8px;
    padding:14px 16px; cursor:pointer; font-family:var(--sans);
    transition:transform .1s ease, box-shadow .1s ease;
    box-shadow:0 2px 0 var(--amber-deep);
  }
  .dl-btn:hover{ transform:translateY(-1px); box-shadow:0 3px 0 var(--amber-deep); }
  .dl-btn:active{ transform:translateY(1px); box-shadow:0 1px 0 var(--amber-deep); }
  .dl-btn .n{font-family:var(--mono); font-size:11px; color:var(--amber); letter-spacing:.08em;}
  .dl-btn .t{font-size:14.5px; font-weight:600;}
  .dl-btn .d{font-size:12px; color:#C9BFA0; line-height:1.4;}

  /* preview table */
  .preview-wrap{ overflow-x:auto; border:1px solid var(--rule); border-radius:8px; background:#fff;}
  table.preview{ border-collapse:collapse; width:100%; font-size:12.5px; font-family:var(--mono);}
  table.preview th, table.preview td{
    border-bottom:1px solid var(--rule); border-right:1px solid #EDE7D6;
    padding:7px 10px; white-space:nowrap; text-align:center;
  }
  table.preview th{ background:var(--paper-2); color:var(--steel); font-weight:600; position:sticky; top:0;}
  table.preview td.dayseq{ background:var(--paper-2); font-weight:600; color:var(--ink);}
  table.preview tr:nth-child(17n) td{ border-bottom:2px solid var(--rule); }
  .hint{ font-size:12px; color:var(--ink-soft); margin-top:8px; }

  footer{ margin-top:50px; text-align:center; font-size:11.5px; color:var(--ink-soft); }
  a.reset{ color:var(--steel); cursor:pointer; text-decoration:underline; }

  @media (max-width:640px){
    .summary-row{grid-template-columns:1fr 1fr;}
    header{flex-direction:column; align-items:flex-start;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="title-block">
      <p class="eyebrow">Meter&nbsp;Reading&nbsp;Cycle&nbsp;Organizer</p>
      <h1>抄表日程表整理器</h1>
      <p class="sub">上傳原始抄表輪期 .xls 檔，自動換算全年 12 個抄表月份、17 個日序的抄表日與開票日，並產出 3 種下載格式。</p>
    </div>
    <div class="dial" id="yearDial" style="visibility:hidden;">
      <div class="digits" id="digits"></div>
      <span class="caption">民國→西元</span>
    </div>
  </header>

  <label class="drop" id="dropZone">
    <span class="icon">XLS</span>
    <span class="txt">
      <b>選取或拖曳抄表輪期檔案</b>
      <span>支援 .xls／.xlsx，例如 NBY812_116.xls</span>
      <div class="filename" id="fileName"></div>
    </span>
    <input type="file" id="fileInput" accept=".xls,.xlsx">
  </label>

  <div class="status" id="status"></div>

  <div class="results" id="results">

    <div class="summary-row">
      <div class="card"><div class="k">來源年度 (民國)</div><div class="v" id="rocYear">—</div></div>
      <div class="card"><div class="k">起始年度 (西元)</div><div class="v" id="baseYear">—</div></div>
      <div class="card"><div class="k">首個抄表日</div><div class="v" id="firstDate">—</div></div>
    </div>

    <h2 class="section">下載</h2>
    <div class="downloads">
      <button class="dl-btn" id="dl1">
        <span class="n">載點 01</span>
        <span class="t">日程表.xlsx</span>
        <span class="d">工作簿含 2 張工作表：日程表／日程表(含開票日)</span>
      </button>
      <button class="dl-btn" id="dl2">
        <span class="n">載點 02</span>
        <span class="t">開票日程google日曆設定.csv</span>
        <span class="d">可直接匯入 Google 日曆的全天事件</span>
      </button>
      <button class="dl-btn" id="dl3">
        <span class="n">載點 03</span>
        <span class="t">billing_schedule.csv</span>
        <span class="d">抄表周期表 csv 檔，匯入資料庫用</span>
      </button>
    </div>

    <h2 class="section">完整日程表預覽</h2>
    <div class="preview-wrap">
      <table class="preview" id="previewTable"></table>
    </div>
    <p class="hint">橫向捲動可查看十二月。日序列固定於左側。</p>
  </div>

  <footer>
    每次上傳皆在瀏覽器本機端運算，檔案不會上傳到伺服器。 <span class="reset" id="resetLink">重新選取檔案</span>
  </footer>

</div>

<script>
const MONTH_NAMES = ['一月','二月','三月','四月','五月','六月','七月','八月','九月','十月','十一月','十二月'];
const START_COLS  = ['G','M','S','Y','AE','AK','AQ','AW','BC','BI','BO','BU'];

function pad2(n){ return String(n).padStart(2,'0'); }

function colOffset(letter, off){
  const idx = XLSX.utils.decode_col(letter);
  return XLSX.utils.encode_col(idx + off);
}

// Build the 16 row-pairs for day-seq 01..16 (rows 10-47, skipping a blank
// separator pair every 4 entries).
function buildDayRows(){
  const rows = [];
  let r = 10;
  for(let i=0;i<16;i++){
    rows.push([r, r+1]);
    r += 2;
    if((i+1)%4===0) r += 2;
  }
  return rows;
}

function cellVal(ws, addr){
  const c = ws[addr];
  if(!c || c.v===undefined || c.v===null || c.v==='') return null;
  return c.v;
}

// Sequential state machine for one date series (抄表日 or 開票日), carried
// across all 12 month-blocks in order.
function makeSeries(startYear){
  return { year:startYear, month:null, lastDay:null };
}
function advance(state, monthCell, dayCell){
  const d = parseInt(dayCell, 10);
  if(monthCell !== null){
    const newM = parseInt(monthCell, 10);
    if(state.month !== null && newM < state.month) state.year += 1;
    state.month = newM;
  } else {
    if(state.lastDay !== null && d <= state.lastDay){
      state.month += 1;
      if(state.month > 12){ state.month = 1; state.year += 1; }
    }
  }
  state.lastDay = d;
  return { y: state.year, m: state.month, d: d };
}

function isoDate(dt){ return `${dt.y}-${pad2(dt.m)}-${pad2(dt.d)}`; }
function slashDate(dt){ return `${dt.y}/${dt.m}/${dt.d}`; }

function parseWorkbook(ws){
  const ae3 = cellVal(ws, 'AE3');
  if(ae3 === null) throw new Error('找不到 AE3 儲存格（民國年度），請確認檔案格式與原始範本相符。');
  const rocYear = parseInt(ae3, 10);
  const baseYear = rocYear + 1911;

  const dayRows = buildDayRows();
  const stateRead = makeSeries(baseYear - 1);
  const stateBill = makeSeries(baseYear - 1);

  const monthData = {}; // monthName -> [ {dayseq, read:{y,m,d}, bill:{y,m,d}}, ... 17 entries ]

  START_COLS.forEach((baseCol, mi) => {
    const mname = MONTH_NAMES[mi];
    const rmc = baseCol, rdc = colOffset(baseCol,1);
    const bmc = colOffset(baseCol,2), bdc = colOffset(baseCol,3);
    const entries = [];
    dayRows.forEach(([r1,r2], idx) => {
      const rmv = cellVal(ws, `${rmc}${r1}`);
      const rdv = cellVal(ws, `${rdc}${r2}`);
      const bmv = cellVal(ws, `${bmc}${r1}`);
      const bdv = cellVal(ws, `${bdc}${r2}`);
      if(rdv === null || bdv === null){
        throw new Error(`解析失敗：${mname} 日序${pad2(idx+1)} 缺少必要的日期資料 (檢查欄位 ${rdc}${r2} / ${bdc}${r2})。`);
      }
      const readDate = advance(stateRead, rmv, rdv);
      const billDate = advance(stateBill, bmv, bdv);
      entries.push({ dayseq: idx+1, read: readDate, bill: billDate });
    });
    // day-seq 17: fixed rule - read = 1st of the real month reached at day-seq 16;
    // bill = same as day-seq 12's bill date.
    const d16 = entries[15], d12 = entries[11];
    entries.push({
      dayseq: 17,
      read: { y: d16.read.y, m: d16.read.m, d: 1 },
      bill: { y: d12.bill.y, m: d12.bill.m, d: d12.bill.d }
    });
    monthData[mname] = entries;
  });

  return { rocYear, baseYear, monthData };
}

function cyclecd(dayseq){
  if(dayseq === 17) return [49,50,51];
  return [dayseq, dayseq+16, dayseq+32];
}

// ---------- Output builders ----------

function buildScheduleWorkbook(monthData){
  const wb = XLSX.utils.book_new();

  // Sheet 1: 日序 | CYCLECD x3 | 一月..十二月 (抄表日 only)
  const header1 = ['日序','CYCLECD','CYCLECD','CYCLECD', ...MONTH_NAMES];
  const rows1 = [header1];
  for(let seq=1; seq<=17; seq++){
    const codes = cyclecd(seq);
    const row = [`${pad2(seq)}日序`, ...codes];
    MONTH_NAMES.forEach(mn => {
      const e = monthData[mn].find(x=>x.dayseq===seq);
      row.push(isoDate(e.read));
    });
    rows1.push(row);
  }
  const ws1 = XLSX.utils.aoa_to_sheet(rows1);
  XLSX.utils.book_append_sheet(wb, ws1, '日程表');

  // Sheet 2: two header rows - month name spans 2 cols, then 抄表日/開票日 subheader.
  const row1 = ['日序'];
  const row2 = [''];
  MONTH_NAMES.forEach(mn => { row1.push(mn, mn); row2.push('抄表日','開票日'); });
  const rows2 = [row1, row2];
  for(let seq=1; seq<=17; seq++){
    const row = [`${pad2(seq)}日序`];
    MONTH_NAMES.forEach(mn => {
      const e = monthData[mn].find(x=>x.dayseq===seq);
      row.push(isoDate(e.read), isoDate(e.bill));
    });
    rows2.push(row);
  }
  const ws2 = XLSX.utils.aoa_to_sheet(rows2);
  const merges = [];
  let col = 1;
  MONTH_NAMES.forEach(() => {
    merges.push({ s:{r:0,c:col}, e:{r:0,c:col+1} });
    col += 2;
  });
  ws2['!merges'] = merges;
  XLSX.utils.book_append_sheet(wb, ws2, '日程表(含開票日)');

  return wb;
}

function buildCsv3(monthData){
  const lines = ['Subject,Start date,All Day Event'];
  MONTH_NAMES.forEach((mn, mi) => {
    monthData[mn].forEach(e => {
      const subject = `${pad2(mi+1)}月${pad2(e.dayseq)}日序`;
      lines.push(`${subject},${slashDate(e.read)},TRUE`);
    });
  });
  return lines.join('\r\n');
}

function buildCsv4(monthData){
  const lines = ['cyc_dt,billing_dt,period_type'];
  const oddIdx  = [0,2,4,6,8,10];  // 一,三,五,七,九,十一
  const evenIdx = [1,3,5,7,9,11];  // 二,四,六,八,十,十二

  const emit = (idxList, label) => {
    idxList.forEach(mi => {
      const mn = MONTH_NAMES[mi];
      monthData[mn].forEach(e => {
        lines.push(`${pad2(e.dayseq)},${isoDate(e.read)},${label}`);
      });
    });
  };
  emit(oddIdx, 'A');
  emit(evenIdx, 'B');
  emit([...Array(12).keys()], 'C');
  return lines.join('\r\n');
}

function downloadBlob(content, filename, mime){
  const blob = new Blob([content], { type: mime });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = filename;
  document.body.appendChild(a); a.click();
  document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}

function downloadCsvBom(text, filename){
  downloadBlob('\uFEFF' + text, filename, 'text/csv;charset=utf-8');
}

// ---------- UI wiring ----------

const fileInput = document.getElementById('fileInput');
const dropZone  = document.getElementById('dropZone');
const fileNameEl= document.getElementById('fileName');
const statusEl  = document.getElementById('status');
const resultsEl = document.getElementById('results');
const dial      = document.getElementById('yearDial');
const digitsEl  = document.getElementById('digits');

let currentData = null;

function showStatus(msg, type){
  statusEl.textContent = msg;
  statusEl.className = 'status show ' + type;
}
function clearStatus(){ statusEl.className = 'status'; statusEl.textContent=''; }

function setDial(year){
  digitsEl.innerHTML = '';
  String(year).split('').forEach(ch => {
    const s = document.createElement('span');
    s.className = 'digit'; s.textContent = ch;
    digitsEl.appendChild(s);
  });
  dial.style.visibility = 'visible';
}

function renderPreview(monthData){
  const table = document.getElementById('previewTable');
  let head1 = '<tr><th rowspan="2">日序</th>';
  MONTH_NAMES.forEach(mn => { head1 += `<th colspan="2">${mn}</th>`; });
  head1 += '</tr>';
  let head2 = '<tr>';
  MONTH_NAMES.forEach(() => { head2 += '<th>抄表日</th><th>開票日</th>'; });
  head2 += '</tr>';
  let html = `<thead>${head1}${head2}</thead><tbody>`;
  for(let seq=1; seq<=17; seq++){
    html += `<tr><td class="dayseq">${pad2(seq)}日序</td>`;
    MONTH_NAMES.forEach(mn => {
      const e = monthData[mn].find(x=>x.dayseq===seq);
      html += `<td>${isoDate(e.read)}</td><td>${isoDate(e.bill)}</td>`;
    });
    html += '</tr>';
  }
  html += '</tbody>';
  table.innerHTML = html;
}

function handleFile(file){
  if(!file) return;
  fileNameEl.textContent = file.name;
  clearStatus();
  resultsEl.classList.remove('show');
  dial.style.visibility = 'hidden';

  const reader = new FileReader();
  reader.onload = (evt) => {
    try{
      const data = new Uint8Array(evt.target.result);
      const wb = XLSX.read(data, { type:'array', codepage: 950, cellText:false, cellDates:false });
      const sheetName = wb.SheetNames[0];
      const ws = wb.Sheets[sheetName];
      const parsed = parseWorkbook(ws);
      currentData = parsed;

      document.getElementById('rocYear').textContent = parsed.rocYear;
      document.getElementById('baseYear').textContent = parsed.baseYear;
      const first = parsed.monthData['一月'][0];
      document.getElementById('firstDate').textContent = isoDate(first.read);
      setDial(parsed.baseYear);
      renderPreview(parsed.monthData);

      showStatus(`已成功解析「${sheetName}」工作表，年度換算為西元 ${parsed.baseYear} 年。`, 'ok');
      resultsEl.classList.add('show');
    }catch(err){
      console.error(err);
      showStatus('解析失敗：' + err.message, 'err');
    }
  };
  reader.onerror = () => showStatus('讀取檔案時發生錯誤，請重試。', 'err');
  reader.readAsArrayBuffer(file);
}

fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

['dragover','dragenter'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.add('drag'); });
});
['dragleave','drop'].forEach(evt => {
  dropZone.addEventListener(evt, (e) => { e.preventDefault(); dropZone.classList.remove('drag'); });
});
dropZone.addEventListener('drop', (e) => {
  const f = e.dataTransfer.files[0];
  if(f) handleFile(f);
});

document.getElementById('resetLink').addEventListener('click', () => {
  currentData = null;
  fileInput.value = '';
  fileNameEl.textContent = '';
  resultsEl.classList.remove('show');
  dial.style.visibility = 'hidden';
  clearStatus();
});

document.getElementById('dl1').addEventListener('click', () => {
  if(!currentData) return;
  const wb = buildScheduleWorkbook(currentData.monthData);
  XLSX.writeFile(wb, '日程表.xlsx');
});
document.getElementById('dl2').addEventListener('click', () => {
  if(!currentData) return;
  const csv = buildCsv3(currentData.monthData);
  downloadCsvBom(csv, 'google_calendar.csv');
});
document.getElementById('dl3').addEventListener('click', () => {
  if(!currentData) return;
  const csv = buildCsv4(currentData.monthData);
  downloadCsvBom(csv, 'billing_schedule.csv');
});
</script>
</body>
</html>
